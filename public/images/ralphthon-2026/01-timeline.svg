  <circle cx="150" cy="370" r="6" fill="#0e7a5f"/>
  <text x="172" y="374" font-size="14" fill="#21201c">M0 하네스 → M1 지도 → M2 여기 말고 여기 → M3 업로드 → M4 마감</text>
  <text x="172" y="391" font-size="12" fill="#78756d">커밋 6개 · 반복 1회 · 975초</text>

  <!-- 7 -->
  <text x="128" y="418" font-size="13" font-weight="600" fill="#57544c" text-anchor="end">13:18</text>
  <circle cx="150" cy="414" r="6" fill="#0e7a5f"/>
  <text x="172" y="418" font-size="14" font-weight="700" fill="#0e7a5f">DONE — PLAN 23/23 · npm test 10/10 · 루프 종료</text>
  <text x="172" y="435" font-size="12" fill="#78756d">재호출 · 마감 프롬프트 · 강제 종료 장치는 발동하지 않았다</text>

  <!-- 8 -->
  <text x="128" y="462" font-size="13" font-weight="600" fill="#57544c" text-anchor="end">13:18~15:00</text>
  <circle cx="150" cy="458" r="6" fill="#ffffff" stroke="#8a877f" stroke-width="1.5" stroke-dasharray="2 2"/>
  <text x="172" y="462" font-size="14" fill="#21201c">남은 예비 시간 — 아무도 손대지 않음</text>
  <text x="172" y="479" font-size="12" fill="#78756d">14:30 마감 모드 · 14:40 재호출 금지 · 14:48 강제 종료가 예정돼 있었다</text>

  <!-- 9 -->
  <text x="128" y="506" font-size="13" font-weight="600" fill="#57544c" text-anchor="end">15:00</text>
  <circle cx="150" cy="502" r="6" fill="#21201c"/>
  <text x="172" y="506" font-size="14" fill="#21201c">에이전트룸 개방 — 5분 동작 확인(녹화)</text>
  <text x="172" y="523" font-size="12" fill="#78756d">수정 · 프롬프트 재입력 금지</text>

  <!-- 10 -->
  <text x="128" y="550" font-size="13" font-weight="600" fill="#57544c" text-anchor="end">이후</text>
  <circle cx="150" cy="546" r="6" fill="#21201c"/>
  <text x="172" y="550" font-size="14" fill="#21201c">발표</text>
  <text x="172" y="567" font-size="12" fill="#78756d">"에이전트를 자동으로 다시 출근시키는 장치"</text>
</svg>
