<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="900" height="600" fill="#ffffff"/>
