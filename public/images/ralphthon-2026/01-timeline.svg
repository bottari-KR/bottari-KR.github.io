  <text x="172" y="215" font-size="12" fill="#78756d">노트북 2대 · 디스코드 화면 공유 · 15:00 에이전트룸 · 개입 1회당 −1점</text>

  <!-- 3 -->
  <text x="128" y="242" font-size="13" font-weight="600" fill="#57544c" text-anchor="end">11:58</text>
  <circle cx="150" cy="238" r="6" fill="#21201c"/>
  <text x="172" y="242" font-size="14" fill="#21201c">아이디어 확정 — 숨은 사진 스팟 지도 「샤츠」</text>
  <text x="172" y="259" font-size="12" fill="#78756d">사진 EXIF 로 핀이 찍히고, 유명 스팟 옆 「여기 말고 여기」가 뜬다</text>

  <!-- 4 -->
  <text x="128" y="286" font-size="13" font-weight="600" fill="#57544c" text-anchor="end">12:16~12:51</text>
  <circle cx="150" cy="282" r="6" fill="#21201c"/>
