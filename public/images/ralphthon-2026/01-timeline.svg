  <text x="40" y="68" font-size="13" fill="#78756d">사람이 일한 시간과 에이전트가 일한 시간 — 2026-09-18</text>

  <!-- 범례 -->
  <circle cx="46" cy="96" r="5" fill="#21201c"/>
  <text x="58" y="100" font-size="12" fill="#57544c">사람</text>
  <circle cx="106" cy="96" r="5" fill="#0e7a5f"/>
  <text x="118" y="100" font-size="12" fill="#57544c">에이전트</text>
  <circle cx="186" cy="96" r="5" fill="#ffffff" stroke="#8a877f" stroke-width="1.5" stroke-dasharray="2 2"/>
  <text x="198" y="100" font-size="12" fill="#57544c">아무도</text>

  <!-- 에이전트 구간 강조 -->
  <rect x="30" y="350" width="840" height="84" rx="10" fill="#edf6f2"/>

  <!-- 세로 축 -->
  <line x1="150" y1="134" x2="150" y2="562" stroke="#d8d6d0" stroke-width="2"/>

  <!-- 1 -->
  <text x="128" y="154" font-size="13" font-weight="600" fill="#57544c" text-anchor="end">10시대</text>
  <circle cx="150" cy="150" r="6" fill="#21201c"/>
  <text x="172" y="154" font-size="14" fill="#21201c">대회 안내 · 루프 엔지니어링 강의</text>
  <text x="172" y="171" font-size="12" fill="#78756d">"AI에게 코딩만 시키지 말고 완주 구조를 설계하라"</text>

  <!-- 2 -->
  <text x="128" y="198" font-size="13" font-weight="600" fill="#57544c" text-anchor="end">11:04</text>
  <circle cx="150" cy="194" r="6" fill="#21201c"/>
