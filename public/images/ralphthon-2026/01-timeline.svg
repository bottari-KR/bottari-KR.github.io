  <text x="172" y="303" font-size="12" fill="#78756d">PRD · PLAN(23칸) · AGENTS · PROMPT · 테스트 10개 · ralph.sh</text>

  <!-- 5 -->
  <text x="128" y="330" font-size="13" font-weight="600" fill="#57544c" text-anchor="end">13:02</text>
  <circle cx="150" cy="326" r="6" fill="#21201c"/>
  <text x="172" y="330" font-size="14" fill="#21201c">./start.sh — 엔터 한 번, 손 뗌</text>
  <text x="172" y="347" font-size="12" fill="#78756d">왼쪽 창은 에이전트, 오른쪽 창은 관전</text>

